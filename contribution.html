<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
  <style>
    :root {
      --bg: #e8edf3;
      --ink: #141c33;
      --blue: #3346ff;
      --mark: #ffd23f;
      --surface: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1424;
        --ink: #eef1fb;
        --blue: #7d8bff;
        --surface: #172038;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--ink);
      font: 400 1rem/1.5 system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      background: var(--surface);
      border: 1.5px solid var(--ink);
      border-radius: 18px;
      box-shadow: 6px 6px 0 var(--blue);
    }

    h1 {
      margin: 0 0 1.2rem;
      font-size: 2.2rem;
      letter-spacing: -0.03em;
    }

    button {
      padding: 0.7rem 1.3rem;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: var(--surface);
      font: 600 1rem inherit;
      font-family: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    #contributor-student-id {
      display: inline-block;
      min-height: 2rem;
      margin: 1.2rem 0;
      font-weight: 600;
      background: linear-gradient(transparent 60%, var(--mark) 60%) no-repeat;
    }

    #contributor-student-id:empty {
      background: none;
    }

    a {
      display: block;
      color: var(--ink);
      font-weight: 600;
    }

    .error {
      color: #c8302f;
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Contribution</h1>
    <button id="load-contributor" type="button">Show Contributor</button>
    <p id="contributor-student-id" role="status"></p>
    <a href="index.html">Back to Task Manager</a>
  </main>

  <script>
    const out = document.getElementById("contributor-student-id");

    document.getElementById("load-contributor").addEventListener("click", async () => {
      out.classList.remove("error");
      try {
        const res = await fetch("contribution.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        out.textContent = "Contributor Student ID: " + data.contributorStudentId;
      } catch (e) {
        out.classList.add("error");
        out.textContent = "Could not load contribution.json.";
      }
    });
  </script>
</body>
</html>
